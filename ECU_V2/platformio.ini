; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_filters = time, log2file
build_flags = -D LOG_FILE_PATH="logs/log_${date}_${time}.log"
lib_deps = https://github.com/BYU-Racing/Utils
    https://github.com/tonton81/FlexCAN_T4

[env:native]
platform = native
test_framework = unity
# If we're building it for a native target (e.g. local computer), it means we're building it to test it.
build_flags = -DBUILD_MODE_TEST -g3 -fsanitize=address -fsanitize=undefined -Wall
lib_deps = https://github.com/BYU-Racing/Utils
    https://github.com/FabioBatSilva/ArduinoFake
