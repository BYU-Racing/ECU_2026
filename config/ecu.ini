[ecu_base]
extends = common
platform = teensy
board = teensy41
framework = arduino
build_flags = ${common.build_flags}
build_src_flags = ${common.build_src_flags} -Wpedantic -DLOG_FILE_PATH="logs/log_${date}_${time}.log" 
build_src_filter = "+<ecu.cpp>"
monitor_filters = time, log2file
lib_deps = https://github.com/tonton81/FlexCAN_T4

[env:ecu_debug]
extends = ecu_base
build_type = debug
build_flags = ${ecu_base.build_flags} -DENABLE_DEBUGGING
