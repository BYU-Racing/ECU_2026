[ecu_base]
extends = common
platform = teensy
board = teensy41
framework = arduino
build_flags = ${common.build_flags}
; Don't generate warnings for FlexCAN code.
    -isystem .pio/libdeps/ecu_debug/FlexCAN_T4
; Because we use some code that has macros, we'll get warnings for these things
; unless we silence them.
    -Wno-variadic-macros 
    -Wno-gnu-zero-variadic-macro-arguments
build_src_flags = ${common.build_src_flags} -DLOG_FILE_PATH="logs/log_${date}_${time}.log" 
build_src_filter = "+<ecu.cpp>"
monitor_filters = time, log2file
lib_deps = https://github.com/tonton81/FlexCAN_T4

[env:ecu_debug]
extends = ecu_base
build_type = debug
build_flags = ${ecu_base.build_flags} -DENABLE_DEBUGGING
