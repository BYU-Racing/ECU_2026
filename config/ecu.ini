[ecu_base]
extends = common
platform = teensy
board = teensy41
framework = arduino
build_flags = ${common.build_flags}
; Don't generate warnings for FlexCAN code (by making the compiler pretend
; they're system files).
    -isystem .pio/libdeps/ecu_not_rules_compliant/FlexCAN_T4
; Because some of our code uses macros, those macros will expand into code
; that will throw these warnings. We ignore them so we don't have tons of
; warnings.
    -Wno-variadic-macros 
    -Wno-gnu-zero-variadic-macro-arguments
build_src_flags = ${common.build_src_flags} -DLOG_FILE_PATH="logs/log_${date}_${time}.log" 
build_src_filter = "+<ecu.cpp>"
monitor_filters = time, log2file
lib_deps = https://github.com/tonton81/FlexCAN_T4


[env:ecu_not_rules_compliant]
extends = ecu_base
build_type = debug
build_flags = ${ecu_base.build_flags} -DENABLE_DEBUGGING -DFIXME_HACKS_TO_GET_THINGS_WORKING
